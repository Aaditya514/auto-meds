server.port=8080

# PostgreSQL DB Connection Configuration (Externalized with Environment Fallbacks)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/automeds}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=AutoMedsHikariPool

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Database Migration Configuration
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.drop-first=false

# Database Initialization
spring.sql.init.mode=never

# JWT Configuration (Access & Refresh Tokens)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# File Upload Configuration
file.upload-dir=uploads/prescriptions
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Scheduling Config
automeds.refill-buffer-days=5

# Spring Mail SMTP Configuration (Externalized)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# ──────────────────────────────────────────────────────────────────────────────
# Spring Boot Actuator & Prometheus Observability (Phase 6)
# ──────────────────────────────────────────────────────────────────────────────

# Expose health, info, metrics, and prometheus actuator endpoints (env strictly removed)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
# Exclude mail from health rollup — SMTP not configured in dev environment
management.health.mail.enabled=false

# Prometheus metrics format — Grafana/Prometheus scrapes /actuator/prometheus
management.prometheus.metrics.export.enabled=true

# HikariCP pool metrics (connection pool health visible in Prometheus)
management.metrics.enable.hikaricp=true

# Enable JVM, HTTP request, and system metrics
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.http.server.requests=true

# Application info tags added to all metrics (useful for multi-instance environments)
management.metrics.tags.application=auto-meds
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:development}

# Correlation ID header — Angular interceptor sends X-Correlation-ID; logged via MDC
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [corrId=%X{correlationId}] %logger{36} - %msg%n

# ──────────────────────────────────────────────────────────────────────────────
# H1 - SMS Refill Confirmation (Twilio)
# Set automeds.sms.enabled=true in production and supply Twilio credentials.
# Disabled by default so development works without a Twilio account.
# ──────────────────────────────────────────────────────────────────────────────
automeds.sms.enabled=${SMS_ENABLED:false}
automeds.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
automeds.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
automeds.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

