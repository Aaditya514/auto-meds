services:
  # ============================================================================
  # 1. PostgreSQL Relational Database Service (Public Schema V1..V5 Migrations)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: automeds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automeds}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Securely bind to localhost only (prevents public internet exposure while allowing SSH tunnels)
      - "127.0.0.1:5432:5432"
    volumes:
      - automeds-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automeds"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - automeds-net

  # ============================================================================
  # 2. Spring Boot 3 Backend API with Native Linux Tesseract OCR Engine
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automeds-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Securely bind to localhost only (Nginx reverse proxies API via internal automeds-net)
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/automeds}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/automeds}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_LIQUIBASE_ENABLED: ${SPRING_LIQUIBASE_ENABLED:-true}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: ${JWT_SECRET}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_UPLOAD_DIR: /app/uploads/prescriptions
      APP_TESSERACT_DATA_PATH: /usr/share/tesseract-ocr/4.00/tessdata
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_WEBHOOK_TOKEN: ${TWILIO_WEBHOOK_TOKEN:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NEMOTRON_MODEL: ${NVIDIA_NEMOTRON_MODEL:-nvidia/nemotron-parse}
      NVIDIA_API_URL: ${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx384m -XX:+UseG1GC}
    volumes:
      - automeds-uploads:/app/uploads/prescriptions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - automeds-net

  # ============================================================================
  # 3. Angular 16 Production Frontend with Nginx Reverse Proxy
  # ============================================================================
  frontend:
    build:
      context: ./auto-meds-frontend/auto-meds-frontend
      dockerfile: Dockerfile
    container_name: automeds-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - automeds-net

# ==============================================================================
# Persistent Named Volumes & Network Definition
# ==============================================================================
volumes:
  automeds-pgdata:
    driver: local
  automeds-uploads:
    driver: local

networks:
  automeds-net:
    driver: bridge
